  tm-backend-api:
    build:
      context: ../
      dockerfile: docker/backend/Dockerfile
    container_name: tm-backend
    ports:
      - "8082:8080"
    environment:
      server.port: 8080
      server.servlet.context-path: /api
      app.cors.allowed-origins: http://localhost:3000,http://localhost:8080
    restart: unless-stopped
    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/localhost/8080'
      interval: 5s
      timeout: 5s
      retries: 30
    networks:
      - tm_network

  tm-frontend-webapp:
    build:
      context: ../
      dockerfile: docker/frontend/Dockerfile
    container_name: tm-frontend
    ports:
      - "8083:80"
    environment:
      REACT_APP_CONTEXT_PATH: /webapp
      REACT_APP_API_BASE_URL: http://localhost:8080/api
      NODE_ENV: production
    volumes:
      - ../docker/frontend/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    healthcheck:
      test: timeout 10s bash -c ':> /dev/tcp/localhost/80'
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      - tm-backend-api
    networks:
      - tm_network

  nginx-proxy:
    image: nginx:latest
    container_name: tm-nginx-proxy
    restart: "no"
    ports:
      - "8080:8080"
    volumes:
      - ../docker/nginx-proxy/html:/usr/share/nginx/html:ro
      - ../docker/nginx-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../docker/nginx-proxy/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - tm-backend-api
      - tm-frontend-webapp
    networks:
      - tm_network

volumes:
  tm_data:
    driver: local

networks:
  tm_network:
    driver: bridge