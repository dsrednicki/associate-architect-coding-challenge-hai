server {
    listen 8080;
    server_name _;

    client_header_buffer_size 1k;
    client_header_timeout 5s;
    client_max_body_size 32k;
    client_body_buffer_size 1k;
    client_body_in_file_only off;
    client_body_in_single_buffer off;
    client_body_timeout 10s;

    ##
    # Gzip Settings
    ##
    gzip on;
    gzip_http_version 1.1;
    gzip_disable      "MSIE [1-6]\.";
    gzip_min_length   1100;
    gzip_vary         on;
    gzip_proxied      expired no-cache no-store private auth;
    gzip_types        text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level   9;

    charset utf-8;

    if ($request_uri ~ ^(.*)\.(css|svg|ico|woff|woff2)) {
        set $browser_check 0;
    }
    if ($browser_check = 1) {
        return 400 "Browser not supported";
    }

    # Caches static assets
    location ~ ^/(assets|bower_components|scripts|styles|views|static) {
      expires     31d;
      add_header  Cache-Control "public";
    }

    # Caches static output created by build
    location ~* \.(?:.js|.css)$ {
      expires 1M;
      add_header Cache-Control "public";
    }

    proxy_http_version 1.1;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Host $host;

    proxy_hide_header Authorization;
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header X-Powered-By;

    add_header Referrer-Policy no-referrer;
    add_header Content-Security-Policy-Report-Only "base-uri 'self'; default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; connect-src 'self'; font-src 'self' data:; style-src 'self' 'unsafe-inline'; img-src 'self' data: image/png:base64; frame-src 'self'; frame-ancestors 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests;";
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;
    add_header X-XSS-Protection "1; mode=block";

    index index.html;

    location / {
        root /usr/share/nginx/html;
    }

    set $frontend "http://tm-frontend-webapp:80";
    #set $frontend "http://host.docker.internal:3000";
    location /webapp/ {
        proxy_pass $frontend;
    }

    set $backend "http://tm-backend-api:8080";
    location /api/ {
        proxy_pass $backend;
    }

}
